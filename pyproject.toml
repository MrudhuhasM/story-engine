[project]
name = "story-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mrudhuhas", email = "mrudhuhas@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "openai>=2.37.0",
    "pydantic>=2.0",
    "sentence-transformers>=5.5.0",
]

[project.scripts]
story-engine = "story_engine:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]
